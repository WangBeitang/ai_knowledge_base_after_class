<!-- 导入演示页面，用于上传文档并观察导入状态。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件导入服务</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 960px;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background-color: #ecf6fd;
        }
        .upload-icon {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 10px;
        }
        .file-input {
            display: none;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #eef3f8;
            color: #34495e;
        }
        .btn-secondary:hover {
            background-color: #dfeaf4;
        }
        .history-notice {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
        }
        .history-notice.is-success {
            display: block;
            color: #17653a;
            background-color: #edf9f1;
            border-color: #b9e3c7;
        }
        .history-notice.is-error {
            display: block;
            color: #9f2d24;
            background-color: #fff2f0;
            border-color: #f2c2bc;
        }
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
        }
        .history-header h2 {
            margin: 0;
            color: #2c3e50;
            font-size: 20px;
        }
        .file-list {
            margin-top: 16px;
        }
        .file-item {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }
        .file-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .document-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            flex: 0 0 auto;
        }
        .document-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .document-action {
            min-width: 72px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 10px;
            border: 1px solid #cfd8e3;
            border-radius: 6px;
            background-color: #fff;
            color: #34495e;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }
        .document-action:hover:not(:disabled) {
            background-color: #f3f7fa;
            border-color: #9fb2c5;
        }
        .document-action.delete-action {
            color: #b03a2e;
            border-color: #e6b8b3;
        }
        .document-action.delete-action:hover:not(:disabled) {
            background-color: #fff2f0;
            border-color: #d58d85;
        }
        .document-action:disabled {
            color: #98a3ad;
            background-color: #f4f6f8;
            border-color: #e0e5ea;
            cursor: not-allowed;
        }
        .document-action svg {
            width: 15px;
            height: 15px;
            flex: 0 0 auto;
        }
        .action-message {
            display: none;
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.5;
        }
        .action-message.is-error {
            display: block;
            color: #b03a2e;
        }
        .file-name {
            font-weight: 600;
            color: #333;
            overflow-wrap: anywhere;
        }
        .file-size {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            min-width: 80px;
            text-align: center;
        }
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 6px 12px;
            margin-top: 8px;
            font-size: 12px;
            color: #566573;
        }
        .failure-summary {
            display: none;
            margin-top: 8px;
            color: #c0392b;
            font-size: 13px;
            line-height: 1.5;
        }
        .empty-state {
            color: #7f8c8d;
            font-size: 14px;
            padding: 16px 0;
        }
        .status-uploading { background-color: #f39c12; }
        .status-processing { background-color: #3498db; }
        .status-completed { background-color: #2ecc71; }
        .status-error { background-color: #e74c3c; }
        .status-deleted { background-color: #7f8c8d; }
        
        /* 简单的进度条 */
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background-color: #f0f0f0;
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background-color: #f39c12;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }

        /* 任务日志（可展开/收起） */
        .log-details {
            margin-top: 8px;
            font-size: 12px;
            color: #7f8c8d;
        }
        .log-details summary {
            cursor: pointer;
            user-select: none;
            color: #6c7a89;
        }
        .log-list {
            margin: 6px 0 0 16px;
            padding: 0;
        }
        .detail-heading {
            margin-top: 8px;
            color: #34495e;
            font-weight: 600;
        }
        .detail-list {
            margin: 6px 0 0 16px;
            padding: 0;
        }
        .log-list li,
        .detail-list li {
            margin: 2px 0;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }
        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 18px;
            }
            .upload-area {
                padding: 28px 16px;
            }
            .file-item {
                flex-direction: column;
                gap: 12px;
            }
            .document-side {
                width: 100%;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
            .document-actions {
                margin-left: auto;
            }
            .document-action {
                min-width: 68px;
            }
            .status-badge {
                min-width: 72px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📄 知识库文件导入</h1>
    
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">☁️</div>
        <p>点击或拖拽文件到此处 (PDF/MD)</p>
        <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
    </div>

    <div id="activeFileList" class="file-list">
        <!-- 当前上传任务将在这里生成 -->
    </div>

    <div class="history-header">
        <h2>我的导入记录</h2>
        <button type="button" class="btn btn-secondary" id="refreshHistoryBtn">刷新</button>
    </div>
    <div id="historyNotice" class="history-notice" role="status" aria-live="polite"></div>
    <div id="fileList" class="file-list">
        <!-- 历史导入记录将在这里生成 -->
    </div>
</div>

<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const activeFileList = document.getElementById('activeFileList');
    const fileList = document.getElementById('fileList');
    const refreshHistoryBtn = document.getElementById('refreshHistoryBtn');
    const historyNotice = document.getElementById('historyNotice');
    
    // 默认走导入服务同源地址；如你把页面单独打开（file://），回退到导入服务默认端口。
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8000';
    const USER_ID_STORAGE_KEY = 'kb_user_id';
    const currentUserId = getOrCreateUserId();
    const HISTORY_REFRESH_INTERVAL_MS = 2000;
    // 历史列表只允许一个延时刷新器。使用 setTimeout 而不是 setInterval，
    // 可以确保上一次 /documents 请求完成后才调度下一次，避免网络较慢时并发堆积。
    let historyRefreshTimer = null;
    const STATUS_LABELS = {
        pending: '等待中',
        uploaded: '已上传',
        processing: '处理中',
        completed: '已完成',
        failed: '失败',
        deleted: '已删除',
    };
    const FAILED_NODE_MESSAGES = {
        upload_file: '文件保存失败，请重新上传',
        node_entry: '文件类型不支持或文件信息读取失败',
        node_pdf_to_md: 'PDF 解析失败，请检查文件是否损坏或格式是否支持',
        node_md_img: 'Markdown 图片处理失败',
        node_subject_name_recognition: '文档主题识别失败',
        node_bge_embedding: '文档向量化失败，请稍后重试',
        node_import_milvus: '文档索引入库失败，请稍后重试',
    };
    const ERROR_CODE_MESSAGES = {
        // import_service_restarted 表示后台进程已退出，不是 failed_node
        // 对应的 PDF/Milvus 节点自身报错，因此必须优先于节点文案展示。
        import_service_restarted: '服务重启导致导入中断，请重新上传或重建索引',
    };

    function createUserId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
            return `user_${window.crypto.randomUUID()}`;
        }
        return `user_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
    }

    function getOrCreateUserId() {
        const existingUserId = localStorage.getItem(USER_ID_STORAGE_KEY);
        if (existingUserId) {
            return existingUserId;
        }

        const userId = createUserId();
        localStorage.setItem(USER_ID_STORAGE_KEY, userId);
        return userId;
    }

    function userHeaders() {
        return {
            'X-User-Id': currentUserId,
        };
    }

    function renderLucideIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }
    }

    function showHistoryNotice(message, type = 'success') {
        historyNotice.textContent = message;
        historyNotice.className = `history-notice is-${type}`;
    }

    function clearHistoryNotice() {
        historyNotice.textContent = '';
        historyNotice.className = 'history-notice';
        delete historyNotice.dataset.connectionError;
    }

    function showConnectionUnknownNotice() {
        showHistoryNotice('服务连接中断，任务状态暂时无法确认，正在重试', 'error');
        historyNotice.dataset.connectionError = 'true';
    }

    function clearConnectionUnknownNotice() {
        // 只清理由轮询写入的断线提示，不覆盖“已提交重建”等用户操作结果。
        if (historyNotice.dataset.connectionError === 'true') {
            clearHistoryNotice();
        }
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
        }[char]));
    }

    function formatTime(value) {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString('zh-CN', { hour12: false });
    }

    function statusLabel(status) {
        return STATUS_LABELS[status] || status || '未知';
    }

    function statusClass(status) {
        if (status === 'completed') return 'status-completed';
        if (status === 'failed') return 'status-error';
        if (status === 'processing') return 'status-processing';
        if (status === 'deleted') return 'status-deleted';
        return 'status-uploading';
    }

    function failureSummary(record) {
        const errorCode = record?.error_code || '';
        if (ERROR_CODE_MESSAGES[errorCode]) return ERROR_CODE_MESSAGES[errorCode];
        const failedNode = record?.failed_node || '';
        if (!failedNode && record?.status !== 'failed') return '';
        return FAILED_NODE_MESSAGES[failedNode] || '导入失败，请稍后重试或联系管理员';
    }

    function detailLine(label, value) {
        return `<li>${escapeHtml(label)}：${escapeHtml(value || '-')}</li>`;
    }

    function renderFailureSummary(itemEl, record) {
        const failureEl = itemEl.querySelector('.failure-summary');
        if (!failureEl) return;
        const summary = failureSummary(record);
        failureEl.textContent = summary;
        failureEl.style.display = summary ? 'block' : 'none';
    }

    function renderTaskDetails(itemEl, data) {
        const detailListEl = itemEl.querySelector('.detail-list');
        if (!detailListEl) return;

        const lines = [
            detailLine('task_id', data.task_id),
            detailLine('document_id', data.document_id),
            detailLine('dataset_id', data.dataset_id),
            detailLine('failed_node', data.failed_node),
            detailLine('error_code', data.error_code),
            detailLine('error_message', data.error_message),
        ];
        detailListEl.innerHTML = lines.join('');
    }

    function scheduleHistoryRefresh(shouldContinue) {
        if (historyRefreshTimer !== null) {
            clearTimeout(historyRefreshTimer);
            historyRefreshTimer = null;
        }
        if (!shouldContinue) return;

        historyRefreshTimer = setTimeout(() => {
            historyRefreshTimer = null;
            loadDocumentHistory({ automatic: true });
        }, HISTORY_REFRESH_INTERVAL_MS);
    }

    async function loadDocumentHistory({ automatic = false } = {}) {
        // 手动刷新或上一次延时器触发时，先取消旧计时器，始终只保留一条轮询链。
        scheduleHistoryRefresh(false);
        if (!automatic) refreshHistoryBtn.disabled = true;
        try {
            const response = await fetch(`${API_BASE}/documents`, {
                headers: userHeaders(),
            });
            if (!response.ok) {
                throw new Error(`Load documents failed: ${response.status}`);
            }
            const data = await response.json();
            const documents = Array.isArray(data.items) ? data.items : [];
            renderDocumentHistory(documents);
            clearConnectionUnknownNotice();
            // uploaded/processing 都是非终态 document。只要历史中仍有任意一条，
            // 页面就继续刷新；全部进入 completed/failed 后自动停止。
            const hasActiveDocument = documents.some(
                (item) => ['uploaded', 'processing'].includes(item?.status)
            );
            scheduleHistoryRefresh(hasActiveDocument);
            return true;
        } catch (error) {
            console.error(error);
            // 网络断开不等于后台任务失败。保留上一次成功渲染的状态，
            // 只告知用户“当前无法确认”，并继续尝试连接恢复后的后端终态。
            if (!fileList.children.length) {
                fileList.innerHTML = '<div class="empty-state">导入记录暂时无法加载</div>';
            }
            showConnectionUnknownNotice();
            scheduleHistoryRefresh(true);
            return false;
        } finally {
            if (!automatic) refreshHistoryBtn.disabled = false;
        }
    }

    function renderDocumentHistory(documents) {
        fileList.innerHTML = '';
        if (!documents.length) {
            fileList.innerHTML = '<div class="empty-state">暂无导入记录</div>';
            return;
        }

        for (const documentRecord of documents) {
            fileList.insertAdjacentHTML('beforeend', createDocumentHistoryHtml(documentRecord));
        }
        renderLucideIcons();
    }

    function createDocumentHistoryHtml(documentRecord) {
        const canOperate = ['completed', 'failed'].includes(documentRecord.status);
        const disabledAttribute = canOperate ? '' : 'disabled';
        const disabledTitle = canOperate ? '' : '文档处理完成后才能操作';
        const summary = failureSummary(documentRecord);
        const failureHtml = summary
            ? `<div class="failure-summary" style="display:block">${escapeHtml(summary)}</div>`
            : '<div class="failure-summary"></div>';
        const detailLines = [
            detailLine('document_id', documentRecord.document_id),
            detailLine('latest_task_id', documentRecord.latest_task_id),
            detailLine('dataset_id', documentRecord.dataset_id),
            detailLine('subject_id', documentRecord.subject_id),
            detailLine('standard_subject_name', documentRecord.standard_subject_name),
            detailLine('md_path', documentRecord.md_path),
            detailLine('failed_node', documentRecord.failed_node),
            detailLine('error_code', documentRecord.error_code),
            detailLine('error_message', documentRecord.error_message),
        ].join('');

        return `
            <div class="file-item" data-document-id="${escapeHtml(documentRecord.document_id)}">
                <div class="file-info">
                    <span class="file-name">${escapeHtml(documentRecord.file_name || documentRecord.document_id)}</span>
                    <div class="meta-grid">
                        <span>上传：${escapeHtml(formatTime(documentRecord.created_at))}</span>
                        <span>解析：${escapeHtml(statusLabel(documentRecord.parse_status))}</span>
                        <span>索引：${escapeHtml(statusLabel(documentRecord.index_status))}</span>
                        <span>Chunk：${escapeHtml(documentRecord.chunk_count ?? 0)}</span>
                    </div>
                    ${failureHtml}
                    <div class="action-message" role="alert"></div>
                    <details class="log-details">
                        <summary>查看详情</summary>
                        <ul class="detail-list">${detailLines}</ul>
                    </details>
                </div>
                <div class="document-side">
                    <div class="status-badge ${statusClass(documentRecord.status)}">${escapeHtml(statusLabel(documentRecord.status))}</div>
                    <div class="document-actions">
                        <button type="button"
                                class="document-action rebuild-action"
                                data-action="rebuild"
                                data-operable="${canOperate}"
                                aria-label="重建索引"
                                title="${disabledTitle || '重建索引'}"
                                ${disabledAttribute}>
                            <i data-lucide="refresh-cw" aria-hidden="true"></i>
                            <span>重建</span>
                        </button>
                        <button type="button"
                                class="document-action delete-action"
                                data-action="delete"
                                data-operable="${canOperate}"
                                aria-label="删除文档"
                                title="${disabledTitle || '删除文档'}"
                                ${disabledAttribute}>
                            <i data-lucide="trash-2" aria-hidden="true"></i>
                            <span>删除</span>
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    function documentActionErrorMessage(error) {
        if (error.status === 404) {
            return '未找到该文档，或你没有操作权限';
        }
        if (error.status === 409) {
            return '当前文档状态不允许此操作，请刷新后重试';
        }
        return '操作失败，请稍后重试';
    }

    function renderDocumentActionError(itemEl, error) {
        const messageEl = itemEl.querySelector('.action-message');
        messageEl.textContent = documentActionErrorMessage(error);
        messageEl.className = 'action-message is-error';

        const detailListEl = itemEl.querySelector('.detail-list');
        let detailEl = detailListEl.querySelector('[data-action-error]');
        if (!detailEl) {
            detailEl = document.createElement('li');
            detailEl.dataset.actionError = 'true';
            detailListEl.appendChild(detailEl);
        }
        detailEl.textContent = `最近操作错误：${error.detail || error.message || '未知错误'}`;
    }

    function setDocumentActionBusy(itemEl, activeButton, isBusy) {
        const buttons = itemEl.querySelectorAll('.document-action');
        for (const button of buttons) {
            button.disabled = isBusy || button.dataset.operable !== 'true';
        }

        const labelEl = activeButton.querySelector('span');
        if (isBusy) {
            activeButton.dataset.originalLabel = labelEl.textContent;
            activeButton.setAttribute('aria-busy', 'true');
            labelEl.textContent = '处理中';
        } else {
            labelEl.textContent = activeButton.dataset.originalLabel || labelEl.textContent;
            activeButton.removeAttribute('aria-busy');
            delete activeButton.dataset.originalLabel;
        }
    }

    async function requestDocumentAction(documentId, action) {
        const suffix = action === 'rebuild' ? '/rebuild' : '';
        const response = await fetch(
            `${API_BASE}/documents/${encodeURIComponent(documentId)}${suffix}`,
            {
                method: action === 'rebuild' ? 'POST' : 'DELETE',
                headers: userHeaders(),
            }
        );
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            const error = new Error(data.detail || `Document action failed: ${response.status}`);
            error.status = response.status;
            error.detail = data.detail || error.message;
            throw error;
        }
        return data;
    }

    async function handleDocumentAction(button) {
        const itemEl = button.closest('.file-item');
        const documentId = itemEl?.dataset.documentId;
        const action = button.dataset.action;
        if (!itemEl || !documentId || !['delete', 'rebuild'].includes(action)) return;

        if (action === 'delete') {
            const fileName = itemEl.querySelector('.file-name')?.textContent || documentId;
            if (!window.confirm(`确定删除“${fileName}”吗？删除后该文档将不再参与检索。`)) {
                return;
            }
        }

        clearHistoryNotice();
        const messageEl = itemEl.querySelector('.action-message');
        messageEl.textContent = '';
        messageEl.className = 'action-message';
        setDocumentActionBusy(itemEl, button, true);

        try {
            await requestDocumentAction(documentId, action);
            showHistoryNotice(action === 'delete' ? '文档已删除' : '已提交重建索引任务');
            await loadDocumentHistory();
        } catch (error) {
            console.error(error);
            renderDocumentActionError(itemEl, error);
        } finally {
            setDocumentActionBusy(itemEl, button, false);
        }
    }

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '#ecf6fd';
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.backgroundColor = '';
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    refreshHistoryBtn.addEventListener('click', () => {
        clearHistoryNotice();
        loadDocumentHistory();
    });

    fileList.addEventListener('click', (event) => {
        const button = event.target.closest('.document-action');
        if (!button || button.disabled) return;
        handleDocumentAction(button);
    });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, percentage) {
        bar.style.width = percentage + '%';
        if (percentage >= 100) {
            bar.style.backgroundColor = '#3498db'; // 蓝色
        } else {
            bar.style.backgroundColor = '#f39c12'; // 橘红色
        }
    }

    async function uploadFile(file) {
        // 创建文件项UI
        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name">${escapeHtml(file.name)}</span>
                    <span class="file-size">${escapeHtml((file.size / 1024).toFixed(2))} KB</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar"></div>
                    </div>
                    <div class="failure-summary"></div>
                    <details class="log-details">
                        <summary>日志（点击展开）</summary>
                        <ul class="log-list"></ul>
                        <div class="detail-heading">技术详情</div>
                        <ul class="detail-list"></ul>
                    </details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>
        `;
        activeFileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');

        // 构建FormData
        const formData = new FormData();
        formData.append('files', file);

        try {
            // 1. 上传文件
            progressContainer.style.display = 'block';
            // 模拟上传进度
            updateProgressBar(progressBar, 50);

            const response = await fetch(`${API_BASE}/upload`, {
                method: 'POST',
                headers: userHeaders(),
                body: formData
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.detail || 'Upload failed');
            }
            
            const result = await response.json();
            const taskId = result.task_ids[0]; // 假设一次传一个或取第一个

            // 上传完成，进入处理中，进度固定为30%
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';

            // 2. 轮询状态
            pollStatus(taskId, itemEl);
            // 新任务已经写入 Mongo，立即刷新一次“我的导入记录”，让历史列表的
            // 单一定时器也开始跟踪该 uploaded/processing document。
            loadDocumentHistory();

        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
            renderFailureSummary(itemEl, {
                status: 'failed',
                failed_node: 'upload_file',
                error_message: error.message,
            });
        }
    }

    function normalizeDoneLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“已完成”
        if (typeof text !== 'string') return String(text);
        return text.endsWith('已完成') ? text : `${text}已完成`;
    }

    function normalizeRunningLog(text) {
        // 后端可能返回中文节点名，也可能已拼接“正在进行.../处理中...”
        if (typeof text !== 'string') return String(text);
        if (text.startsWith('正在进行')) return text.endsWith('...') ? text : `${text}...`;
        return `正在进行${text}...`;
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const logDetails = itemEl.querySelector('.log-details');

        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];

        // 更新 summary（即使收起也能看到进度）
        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;

        // 清空并重建列表
        logListEl.innerHTML = '';
        const lines = [
            ...done.map(normalizeDoneLog),
            ...running.map(normalizeRunningLog),
        ];

        if (lines.length === 0) {
            const li = document.createElement('li');
            li.textContent = '暂无日志';
            logListEl.appendChild(li);
        } else {
            for (const line of lines) {
                const li = document.createElement('li');
                li.textContent = line;
                logListEl.appendChild(li);
            }
        }

        // 如果没有任何日志，默认收起；否则保持用户选择
        if (lines.length === 0) {
            logDetails.open = false;
        }
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE}/status/${taskId}`, {
                    headers: userHeaders()
                });
                if (!res.ok) {
                    throw new Error(`Load task status failed: ${res.status}`);
                }
                const data = await res.json();
                clearConnectionUnknownNotice();

                // 渲染日志（done/running）
                renderLogs(itemEl, data.done_list, data.running_list);
                renderTaskDetails(itemEl, data);
                renderFailureSummary(itemEl, data);
                
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                    loadDocumentHistory().then((isLoaded) => {
                        if (isLoaded) itemEl.remove();
                    });
                } else if (data.status === 'processing') {
                    // 保持处理中状态
                    statusBadge.textContent = '处理中...';
                    // 确保进度为30%
                     updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                    loadDocumentHistory().then((isLoaded) => {
                        if (isLoaded) itemEl.remove();
                    });
                }
            } catch (e) {
                console.error('Polling error', e);
                // 断线时保留卡片上最后一次的“处理中”状态，不由浏览器伪造 failed。
                // 服务恢复后，下一次轮询会读到启动收口写入的真实终态。
                showConnectionUnknownNotice();
            }
        }, 2000); // 每2秒轮询一次
    }

    loadDocumentHistory();
</script>

</body>
</html>
